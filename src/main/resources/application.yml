server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: autochannel

sftp:
  host: localhost
  port: 2222
  username: autochannel
  password: password
  remote-dir: upload

spring:
  main:
    web-application-type: servlet
